name: Publish frozen Stage1C public review bundle
on:
  push:
    branches: ['stage1c-20260908T084753+0800']
permissions:
  contents: write
jobs:
  publish:
    if: github.repository == 'fakerealmike6-netizen/TheSecondPaper'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Read the exact public commit
        env:
          COMMIT: ${{ github.sha }}
        run: |
          git init
          git remote add origin https://github.com/fakerealmike6-netizen/TheSecondPaper.git
          git fetch --depth=1 origin "$COMMIT"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$COMMIT"
      - name: Build deterministic public archive and unique release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: fakerealmike6-netizen/TheSecondPaper
          COMMIT: ${{ github.sha }}
        run: |
          python3 tools/stage1c_release.py --output "$RUNNER_TEMP/Stage1C_Public_Review_Bundle.zip"
          tag='stage1c-20260908T084753+0800'
          if gh release view "$tag" >/dev/null 2>&1; then
            echo 'Existing release is never overwritten.'
            exit 1
          fi
          gh release create "$tag" "$RUNNER_TEMP/Stage1C_Public_Review_Bundle.zip" "$RUNNER_TEMP/Stage1C_Public_Review_Bundle.zip.sha256" --target "$COMMIT" --title 'Stage1C: paired experiments and ablations' --notes-file docs/RELEASE_NOTES.md
